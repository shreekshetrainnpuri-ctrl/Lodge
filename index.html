<style>

:root[data-theme="dark"]{--bg:#161615;--card:#222221;--tx:#efeee9;--mut:#9a9992;--bd:#35342f;--ac:#3fb89c;--red:#e5776a;--grn:#3fb89c;--amb:#e0a84a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:70px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.stat b{display:block;font-size:24px}.stat span{color:var(--mut);font-size:12px}

.room.free{border-color:var(--grn);color:var(--grn)}.room.busy{border-color:var(--red);color:var(--red)}
.room small{display:block;font-weight:400;font-size:10px;color:var(--mut);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 3px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 2px}

button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav a{flex:1;text-align:center;padding:12px 0;color:var(--mut);font-size:12px;text-decoration:none}
nav a.on{color:var(--ac);font-weight:700}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.mut{color:var(--mut);font-size:13px}.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid}
.wrap{overflow-x:auto}
a.btn{display:block;text-align:center;text-decoration:none;padding:11px 14px;border-radius:10px;background:#1e8e3e;color:#fff;font-weight:600;margin-top:10px}
</style></head><body>
<main id="app"><p class="mut">Load ho raha hai…</p></main>
<nav id="nav"></nav>
<script>
(function(){
var DEF=["01","02","03","04"].map(function(n){return{no:n,rate:1199}}).concat(["11","22","33","44"].map(function(n){return{no:n,rate:699}}),["G-01","G-02"].map(function(n){return{no:n,rate:0}})),mon=today().slice(0,7),exp=[],isAdm=false,db=null,canW=true,stays=[],cfg={rooms:DEF,name:"Shreekshetra Inn"},loaded=false,tab="home",sel=null,q="";
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function mask(a){a=String(a||"");return "XXXX XXXX "+a.slice(-4)}
function billN(s,now){if(!s.inAt)return nights(s.inDate,s.outDate);var i=new Date(s.inAt),d=new Date(i);d.setHours(8,0,0,0);if(d<=i)d.setDate(d.getDate()+1);var x=now||new Date();if(x<=d)return 1;return 1+Math.ceil((x-d)/864e5)}

function ft(iso){if(!iso)return"";var d=new Date(iso);return fd(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"))+" "+d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})}

function billTxt(s){var n=billN(s,s.outAt?new Date(s.outAt):new Date()),bill=s.total||n*s.rate;return "*"+cfg.name+"*\n"+ADDR+"\nBill / Receipt\n\nNaam: "+s.name+"\nRoom: "+s.room+"\nCheck-in: "+ft(s.inAt||s.inDate)+"\nCheck-out: "+ft(s.outAt||new Date().toISOString())+"\nRaat: "+n+" x "+inr(s.rate)+"\n\n*Total: "+inr(bill)+"*\nMila: "+inr(paid(s))+"\nBaki: "+inr(bill-paid(s))+"\n\nDhanyavad! Aapka thaharna humein accha laga. Phir zaroor padharein 🙏"}
function welTxt(s){var k=stays.filter(function(x){return x.aadhaar===s.aadhaar}).length;return (k>1?"Phir se swagat hai, "+s.name+" ji! Aapko dobara dekhkar khushi hui. ":"Namaste "+s.name+" ji, "+cfg.name+" me aapka swagat hai! ")+"\nRoom: "+s.room+"\nCheck-in 9 baje se, check-out subah 8 baje.\nKoi bhi zaroorat ho to humein batayein. Aapka thaharna sukhad ho 🙏"}

function stm(){var cash=0,upi=0,nt=0,due=0,rev=0,R={},bk=stays.filter(function(s){return(s.inDate||"").slice(0,7)===mon});
 stays.forEach(function(s){(s.pays||[]).forEach(function(p){if((p.d||"").slice(0,7)===mon){if(p.mode==="UPI")upi+=+p.amt;else cash+=+p.amt}})});
 bk.forEach(function(s){var n=billN(s,s.outAt?new Date(s.outAt):new Date()),b=s.total||n*s.rate;nt+=n;rev+=b;due+=Math.max(0,b-paid(s));var r=R[s.room]=R[s.room]||{n:0,a:0,c:0};r.n+=n;r.a+=b;r.c++});
 return{ex:exp.filter(function(e){return(e.d||"").slice(0,7)===mon}).reduce(function(s,e){return s+e.amt},0),cash:cash,upi:upi,nt:nt,due:due,rev:rev,R:R,c:bk.length}}
function stmTxt(){var x=stm(),t="*"+cfg.name+" - Statement "+mon+"*\nBooking: "+x.c+"\nRaat: "+x.nt+"\nKul bill: "+inr(x.rev)+"\nCash mila: "+inr(x.cash)+"\nUPI mila: "+inr(x.upi)+"\nKul mila: "+inr(x.cash+x.upi)+"\nBaki: "+inr(x.due)+"\nKharcha: "+inr(x.ex)+"\nNet bacha: "+inr(x.cash+x.upi-x.ex)+"\n\nRoom-wise:\n";Object.keys(x.R).sort().forEach(function(k){t+=k+": "+x.R[k].c+" booking, "+x.R[k].n+" raat, "+inr(x.R[k].a)+"\n"});return t}
function stmt(){var x=stm();return '<div class="card"><b>Monthly statement</b><input id="mon" type="month" value="'+mon+'" style="margin-top:8px"><div class="grid" style="margin-top:8px">'+[["Booking",x.c],["Raat",x.nt],["Kul bill",inr(x.rev)],["Kul mila",inr(x.cash+x.upi)],["Cash",inr(x.cash)],["UPI",inr(x.upi)],["Baki",inr(x.due)],["Kharcha",inr(x.ex)],["Net bacha",inr(x.cash+x.upi-x.ex)]].map(function(i){return '<div class="stat"><b style="font-size:18px">'+i[1]+'</b><span>'+i[0]+'</span></div>'}).join("")+'</div><h2>Room-wise</h2>'+(Object.keys(x.R).sort().map(function(k){return '<div class="row"><span>Room '+k+' · '+x.R[k].c+' booking, '+x.R[k].n+' raat</span><b>'+inr(x.R[k].a)+'</b></div>'}).join("")||'<p class="mut">Is mahine koi booking nahi.</p>')+'<button class="sec" data-act="copystmt">Statement copy karo</button></div><h2>Sabhi bookings</h2>'}
function loc(iso){var d=new Date(iso),p=function(n){return String(n).padStart(2,"0")};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes())}
function editCard(s){if(!canW)return"";var ok=isAdm||(s.ec||0)<2;return '<div class="card"><b>Edit</b> <span class="mut">('+(isAdm?"Owner: unlimited":"Staff edit bache: "+Math.max(0,2-(s.ec||0))+"/2")+')</span>'+(ok?'<label>Rate/raat</label><input id="er" type="number" value="'+s.rate+'"><label>Check-in samay</label><input id="ei" type="datetime-local" value="'+loc(s.inAt||s.inDate+"T09:00")+'"><label>Check-out tarikh</label><input id="eo" type="date" value="'+s.outDate+'"><button class="sec" data-act="edit" data-id="'+s.id+'">Edit save karo</button>':'<p class="mut">Limit khatam. Ab ye final hai, sirf owner badal sakta hai.</p>')+((s.log||[]).length&&isAdm?'<div class="mut" style="margin-top:8px">'+s.log.map(function(l){return ft(l.t)+" · "+l.by+": "+esc(l.c)}).join("<br>")+'</div>':"")+'</div>'}
function revTxt(s){return "Namaste "+s.name+" ji, "+cfg.name+" me rukne ke liye dhanyavad! Agar aapko accha laga to 1 minute nikaal kar Google par star rating dijiye: "+cfg.review}
var ADDR="Near Ashok Residency, Puri\nMob: 9348845847\nEmail: shreekshetrainnpuri@gmail.com",FEST=[["Naya Saal","2027-01-01"],["Makar Sankranti","2027-01-14"],["Republic Day","2027-01-26"],["Maha Shivratri","2027-03-06"],["Holi","2027-03-22"],["Ram Navami","2027-04-15"],["Independence Day","2027-08-15"],["Raksha Bandhan","2027-08-17"],["Janmashtami","2027-08-25"],["Dussehra","2027-10-09"],["Diwali","2027-10-29"]],fsel=-1;
function dd(f){return Math.round((new Date(f[1])-new Date(today()))/864e5)}
function festBanner(){var f=FEST.filter(function(x){var d=dd(x);return d>=0&&d<=2})[0];return f?'<div class="card" style="border-color:var(--amb)"><b>'+f[0]+' '+(dd(f)?dd(f)+' din me':'aaj')+' hai</b><div class="mut">Festival tab me jaakar greetings bhejo.</div></div>':""}
function festTxt(s,f){return s.name+" ji, "+cfg.name+" ki taraf se aapko aur aapke parivar ko "+f[0]+" ki hardik shubhkamnayein! Aapka din mangalmay ho. Phir milenge.\n"+ADDR}
function custList(f){var m={};stays.forEach(function(s){m[s.mobile]=s});var k=Object.keys(m);if(!k.length)return'<p class="mut">Abhi koi customer nahi.</p>';return k.map(function(x){var s=m[x];return '<div class="row"><span>'+esc(s.name)+'<br><span class="mut">'+esc(x)+'</span></span><a class="btn" style="margin:0;padding:8px 12px" target="_blank" rel="noopener" href="'+wa(s,festTxt(s,f))+'">Bhejo</a></div>'}).join("")}
function fest(){if(!isAdm)return home();var h='<div class="card"><b>Festival greetings</b><div class="mut">Festival chuno, phir har customer ko WhatsApp par bhejo. Dates ek baar apne calendar se match kar lena.</div></div>';FEST.forEach(function(f,gi){if(dd(f)<-1)return;h+='<div class="card"><div class="row" style="border:0"><span><b>'+f[0]+'</b><br><span class="mut">'+fd(f[1])+'</span></span><button class="sec" style="width:auto;margin:0" data-act="fsel" data-i="'+gi+'">'+(fsel===gi?'Band karo':'Customer list')+'</button></div>'+(fsel===gi?custList(f):'')+'</div>'});return h}
function expv(){var t=today(),h='<div class="card"><b>Kharcha likho</b>'+(canW?'<label>Kitna rupaya</label><input id="xa" type="number" inputmode="numeric"><label>Kis cheez ke liye</label><select id="xc"><option>Safai/Saman</option><option>Bijli/Paani</option><option>Salary</option><option>Repair</option><option>Khana/Chai</option><option>Chadar/Linen</option><option>Anya</option></select><label>Detail (kya liya)</label><input id="xn" placeholder="jaise: phenyl, 2 bulb"><button data-act="xadd">Kharcha save karo</button>':'<p class="mut">Sirf dekhne ka access.</p>')+'</div>';
 var l=exp.filter(function(x){return isAdm?(x.d||"").slice(0,7)===mon:x.d===t}).sort(function(a,b){return a.at<b.at?1:-1}),tot=l.reduce(function(s,x){return s+x.amt},0),C={};l.forEach(function(x){C[x.cat]=(C[x.cat]||0)+x.amt});
 h+='<div class="card"><div class="row" style="border:0"><b>'+(isAdm?'Mahine ka kharcha':'Aaj ka kharcha')+'</b><b>'+inr(tot)+'</b></div>'+(isAdm?'<input id="mon" type="month" value="'+mon+'">'+Object.keys(C).map(function(k){return '<div class="row"><span class="mut">'+k+'</span><span>'+inr(C[k])+'</span></div>'}).join(""):"")+'</div>';
 return h+'<div class="card">'+(l.map(function(x){return '<div class="row"><span><b>'+inr(x.amt)+'</b> · '+esc(x.cat)+'<br><span class="mut">'+esc(x.why)+' · '+fd(x.d)+'</span></span>'+(isAdm?'<button class="sec" style="width:auto;margin:0;padding:6px 10px" data-act="xdel" data-id="'+x.id+'">Hatao</button>':'')+'</div>'}).join("")||'<p class="mut">Koi kharcha nahi.</p>')+'</div>'}
function rateOf(no){var r=cfg.rooms.find(function(x){return x.no===no});return r?r.rate:0}
function fd(d){return d?d.split("-").reverse().join("/"):""}

function render(){
 var nav=[["home","Home"],["in","Check-in"],["exp","Kharcha"]];if(isAdm)nav.push(["find","Customer"],["rec","Record"],["fest","Festival"]);
 $("#nav").innerHTML=nav.map(function(t){return '<a href="#'+t[0]+'" class="'+(tab===t[0]?"on":"")+'">'+t[1]+'</a>'}).join("");
 var h="";
 if(!loaded)h='<p class="mut">Data load ho raha hai…</p>';
 else if(sel)h=viewStay(sel);
 else if(tab==="home")h=home();
 else if(tab==="in")h=checkin();
 else if(tab==="exp")h=expv();else if(tab==="fest")h=fest();else if(tab==="find")h=find();
 else h=records();
 $("#app").innerHTML=h+(loaded?'<button class="sec" data-act="logout" style="margin-top:20px">Logout ('+(isAdm?"Office":"Work")+')</button>':"");
}
function home(){
 var a=active(),n=cfg.rooms.length,t=today();
 var inc=stays.filter(function(s){return s.inDate===t}).reduce(function(x,s){return x+paid(s)},0);
 var h='<div class="grid"><div class="stat"><b style="color:var(--red)">'+a.length+'</b><span>Room bhare</span></div>'+
 '<div class="stat"><b style="color:var(--grn)">'+Math.max(0,n-a.length)+'</b><span>Room khali</span></div>'+
 '<div class="stat"><b>'+a.filter(function(s){return s.outDate<=t}).length+'</b><span>Aaj check-out baki</span></div>'+
 '<div class="stat"><b>'+(isAdm?inr(inc):"—")+'</b><span>Aaj ke check-in ka payment</span></div></div><h2>Rooms</h2><div class="rooms">';
 cfg.rooms.forEach(function(r){var s=roomStay(r.no);h+='<div class="room '+(s?"busy":"free")+'" data-room="'+r.no+'">'+r.no+'<small>'+(s?esc(s.name):(r.rate?inr(r.rate):"Rate baki"))+'</small></div>'});
 h+='</div>';
 if(isAdm)h=festBanner()+h;
 if(isAdm)h+='<h2>Room rate (owner)</h2><div class="card"><label>Lodge ka naam (bill me aayega)</label><input id="ln" value="'+esc(cfg.name)+'"><label>Google review link</label><input id="rv" value="'+esc(cfg.review||"")+'" placeholder="https://g.page/r/.../review">'+cfg.rooms.map(function(r){return '<div class="row"><span>Room '+r.no+'</span><input class="rr" data-no="'+r.no+'" type="number" value="'+(r.rate||"")+'" placeholder="Rate" style="width:110px"></div>'}).join("")+'<button class="sec" data-act="cfg">Rate save karo</button></div><div class="card"><b>Work (lodge boy) password</b><label>Office password (dobara likho)</label><input id="op" type="password"><label>Naya Work password</label><input id="wp" type="text"><button class="sec" data-act="setwork">Work password set karo</button></div><div class="card"><b>Backup</b><div class="mut">Saari bookings aur kharche ki file download hogi. Mahine me ek baar Drive/WhatsApp par rakh lo.</div><button class="sec" data-act="backup">Backup download</button></div>';

function checkin(){
 if(!canW)return '<div class="card">Aapke paas sirf dekhne ka access hai.</div>';
 var opts="",ff="";cfg.rooms.forEach(function(r){if(!roomStay(r.no)){ff=ff||r.no;opts+='<option value="'+r.no+'">'+r.no+'</option>'}});
 return '<div class="card"><h2 style="margin-top:0">Naya Check-in</h2>'+

 '<div id="rep" class="mut"></div>'+
 '<label>Naam</label><input id="nm"><label>Mobile</label><input id="mb" inputmode="numeric" maxlength="10"><label>Pata (gaon/mohalla, shehar, rajya)</label><input id="ad2">'+
 '<div class="grid"><div><label>Room</label><select id="rm">'+(opts||'<option value="">Koi khali nahi</option>')+'</select></div>'+
 '<div><label>Kitne log</label><input id="pp" type="number" value="1"></div>'+

 '<div><label>Check-out tarikh (subah 8 baje)</label><input id="d2" type="date"></div>'+

function find(){if(!isAdm)return home();
 var h='<div class="card"><label>Aadhaar number ya naam/mobile se dhundo</label><input id="q" value="'+esc(q)+'"></div>';
 if(q.length>=3){
  var r=stays.filter(function(s){return String(s.aadhaar)===q||(s.name||"").toLowerCase().indexOf(q.toLowerCase())>-1||String(s.mobile).indexOf(q)>-1});
  var by={};r.forEach(function(s){(by[s.aadhaar]=by[s.aadhaar]||[]).push(s)});

   l.map(function(s){return '<div class="row" data-stay="'+s.id+'"><span>'+fd(s.inDate)+' → '+fd(s.outDate)+'<br><span class="mut">Room '+esc(s.room)+'</span></span><span>'+inr(paid(s))+'</span></div>'}).join("")+'</div>'});

function recs(){

 if(!l.length)return '<p class="mut">Abhi koi record nahi.</p>';
 return '<div class="card">'+l.map(function(s){return '<div class="row" data-stay="'+s.id+'"><span><b>'+esc(s.name)+'</b> · Room '+esc(s.room)+'<br><span class="mut">'+fd(s.inDate)+' → '+fd(s.outDate)+'</span></span><span style="text-align:right">'+inr(paid(s))+'<br><span class="tag" style="color:var(--'+(s.status==="in"?"red":"grn")+')">'+(s.status==="in"?"Andar":"Gaya")+'</span></span></div>'}).join("")+'</div>';

function viewStay(id){
